# GT Racing settings, read by gtracing.exe at every start.
# KEY=VALUE per line; # starts a comment.  A missing or blank key takes the default written here.
# The Display and Graphics settings can also be changed in the game: Options > Display.

# ---- Display and graphics ----------------------------------------------------------------------------------------

# ipad3: the iPad 3's Retina art (sharper).  ipad2: the iPad 2's.
GT_DEVICE=ipad3

# the height in pixels the game draws its picture at: monitor = your monitor's, or a number such as 1080 or
# 1440.  0: the device's own (iPad 2 768, iPad 3 1536).
GT_RESOLUTION=monitor

# the screen's shape: monitor = your monitor's (16:9, 16:10, 21:9), or 1024 4:3, 1229 16:10, 1366 16:9, 1792 21:9.
GT_WIDE=monitor

# 1 full screen, 0 a window (Alt+Enter switches while playing).
GT_FULLSCREEN=1

# anti-aliasing samples: 0 off, 2, 4, 8, or auto (4).  8 can be too much for built-in graphics.
GT_MSAA=auto

# anisotropic filtering (sharper roads at a distance): 1 off, 2, 4, 8, 16.
GT_ANISOTROPIC=16

# motion blur: 1 full (the iPad 2's), 0 light (the iPad 3's, a smaller target), auto: light on built-in graphics
# (Intel / AMD in the processor), full on a graphics card.  A change in the game takes effect at once.
GT_FULL_BLUR=auto

# PostFX: 0 Off (none, as shipped), 2 Classic (the paid 2010 iPad version's bloom), 3 Classic Natural (the same
# glow, the world's own colours kept), 4 Enhanced (the game's own highlight bloom balanced, with a glow from the
# brightest parts in their own colours and slightly richer colours over it, shadows as deep as Off's; the default).
# A change in the game takes effect at once.
GT_POSTFX=4

# 1: drawing slows to 30 frames a second behind other windows and 10 minimized, and a minimized game pauses as an
# iPad does in the background (never during a multiplayer game).  0: always full speed.
GT_BACKGROUND_THROTTLE=1

# ---- Controls and pointer ----------------------------------------------------------------------------------------

# the gold mouse pointer's size, a multiple of 32 px (scaled with Windows' display scale): 1 .. 6.
GT_CURSOR_SIZE=3

# a gamepad's menu pointer glides to the next button in this many ms, 0 = jump.
GT_PAD_GLIDE=140
